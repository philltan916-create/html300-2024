<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Blue Market</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">Contact</a>
        <button>🛒 Cart</button>
    </nav>
</header>

<section class="hero">
    <h2>Summer Sale</h2>
    <p>Save up to 50% Today!</p>
    <button>Shop Now</button>
</section>

<section class="products">

    <div class="card">
        <img src="images/shoes.jpg" alt="Shoes">

        <h3>Running Shoes</h3>

        <p>$79.99</p>

        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="images/hoodie.jpg" alt="Hoodie">

        <h3>Blue Hoodie</h3>

        <p>$49.99</p>

        <button>Add to Cart</button>
    </div>

    <div class="card">
        <img src="images/watch.jpg" alt="Watch">

        <h3>Luxury Watch</h3>

        <p>$199.99</p>

        <button>Add to Cart</button>
    </div>

</section>

<footer>
    <p>© 2026 Blue Market</p>
</footer>

</body>
</html>
